name: Shipit Cloud Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin m4 \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Fix libtool macros
        run: |
          # ڕێکخستنی libtool بۆ چارەسەری کێشەی LT_SYS_SYMBOL_USCORE
          sudo rm -rf /usr/share/aclocal/libtool.m4
          sudo cp /usr/share/aclocal/libtool.m4.orig /usr/share/aclocal/libtool.m4 2>/dev/null || true
          sudo aclocal --force -I /usr/share/aclocal 2>/dev/null || true
          sudo autoreconf --force --install /usr/share/aclocal 2>/dev/null || true
          # دڵنیابوونەوە لەوەی m4 هەیە
          which m4 && m4 --version

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Patch libtool macro
        run: |
          # دۆزینەوە و ڕاستکردنەوەی libtool.m4
          find /usr/share/aclocal -name "libtool.m4" -exec sudo sed -i 's/m4_pattern_forbid(\[^LT_/m4_pattern_allow([^LT_/g' {} \; 2>/dev/null || true
          sudo ln -sf /usr/share/aclocal/libtool.m4 /usr/share/aclocal/libtool.m4 2>/dev/null || true

      - name: Build APK with Buildozer
        run: |
          # Disable libtool macro check
          export ACLOCAL_PATH="/usr/share/aclocal:$ACLOCAL_PATH"
          export LIBTOOLIZE=libtoolize
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Show errors if failed
        if: failure()
        run: |
          echo "=== Last 100 lines of build.log ==="
          tail -100 build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: bin/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
